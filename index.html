<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- =============== WEBSITE META DATA =============== -->
  <title>Aqua Portal</title>
  <link rel="shortcut icon" href="./assets/img/logo.avif" type="image/x-icon">

  <!-- =============== AUTHOR META DATA =============== -->
  <meta name="author" content="Sarfraj Shaikh">
  <meta name="publisher" content="Sarfraj Shaikh">
  <meta name="creator" content="Sarfraj Shaikh">

  <!-- =============== CSS FILE =============== -->
  <link rel="stylesheet" href="./assets/files/css/common.css">
  <link rel="stylesheet" href="./assets/files/css/style.css">

  <!-- =============== JS FILE =============== -->
  <script src="./assets/files/js/common.js" defer></script>
  <script src="./assets/files/js/main.js" defer></script>

  <!-- =============== ICON CDN =============== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

  <!-- =============== AOS & ANIMATE CDN =============== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">


  <!--===================================== 
    Student: Mo. Sarfraj Shaikh
    Course: JavaScript
    Chapter 50 - 52
    Date: 9-04-2026 | 7-05-2026
    =====================================-->
</head>

<body>

  <!-- =============== LOADER =============== -->
  <div class="page-loader" id="pageLoader">
    <div class="dot-spinner">
      <div class="dot-spinner__dot"></div>
      <div class="dot-spinner__dot"></div>
      <div class="dot-spinner__dot"></div>
      <div class="dot-spinner__dot"></div>
      <div class="dot-spinner__dot"></div>
      <div class="dot-spinner__dot"></div>
      <div class="dot-spinner__dot"></div>
      <div class="dot-spinner__dot"></div>
    </div>
  </div>

  <!-- =============== NO NETWORK =============== -->
  <div class="no-internet" id="noInternet">
    <div class="no-internet-card">

      <div class="icon-circle">
        <i class="ri-wifi-off-line"></i>
      </div>

      <h2>No Internet</h2>
      <p>
        You're offline. Please check your Wi-Fi or mobile data connection.
      </p>

      <div class="btn-group">
        <button class="retry-btn" onclick="location.reload()">
          <i class="ri-refresh-line"></i> Retry
        </button>
      </div>

      <span class="hint">
        Waiting for network...
      </span>

    </div>
  </div>

  <!-- =============== NAVBAR =============== -->
  <nav class="navbar" id="navBar">

    <div class="nav-left" id="navLeft">
      <img src="./assets/img/logo.avif" alt="Aqua Portal" loading="lazy">
      <p id="navWebName"></p>
    </div>

    <div class="nav-right">

      <div class="cta-btn" id="navPrimaryCtaBtn">
        <i class="ri-user-line"></i>
        <span>Login</span>
      </div>

    </div>

  </nav>

  <!-- =============== HERO SECTION =============== -->
  <header class="hero">

    <div class="message-box">
      <h2 id="heroWelText"></h2>
      <p id="heroSubTitle"></p>
    </div>

    <div class="btn-box">

      <div class="getStartBtn" id="getStartBtn">
        <i class="ri-sparkling-line"></i>
        <span>Get Started</span>
      </div>

      <div class="loginBtn" id="loginBtn">
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
        <span>Login</span>
      </div>
    </div>

  </header>

</body>

</html>
