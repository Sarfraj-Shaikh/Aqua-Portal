<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- =============== WEBSITE META DATA =============== -->
    <title>Manage Voucher | Aqua Portal</title>
    <link rel="shortcut icon" href="../../../../assets/img/logo.avif" type="image/x-icon">

    <!-- =============== AUTHOR META DATA =============== -->
    <meta name="author" content="Sarfraj Shaikh">
    <meta name="publisher" content="Sarfraj Shaikh">
    <meta name="creator" content="Sarfraj Shaikh">

    <!-- =============== CSS FILE =============== -->
    <link rel="stylesheet" href="./manage-voucher.css">

    <!-- =============== JS FILE =============== -->
    <script src="./manage-voucher.js" defer></script>

    <!-- =============== ICON CDN =============== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- =============== TOASTIFY CDN =============== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <!-- =============== TOASTIFY CDN =============== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <!-- =============== AOS & ANIMATE CDN =============== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>

    <!-- =============== LOADER =============== -->
    <div class="page-loader" id="pageLoader">
        <div class="dot-spinner">
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
        </div>
    </div>

    <!-- =============== NO NETWORK =============== -->
    <div class="no-internet" id="noInternet">
        <div class="no-internet-card">

            <div class="icon-circle">
                <i class="ri-wifi-off-line"></i>
            </div>

            <h2>No Internet</h2>
            <p>
                You're offline. Please check your Wi-Fi or mobile data connection.
            </p>

            <div class="btn-group">
                <button class="retry-btn" onclick="location.reload()">
                    <i class="ri-refresh-line"></i> Retry
                </button>
            </div>

            <span class="hint">
                Waiting for network...
            </span>

        </div>
    </div>

    <!-- =============== POPUP DIALOGUE =============== -->
    <div class="popup-con" id="popupContainer">
        <div class="popup" id="popupBox">

            <div class="top">
                <p class="title" id="popTitle">POPUP MESSAGE</p>
                <i class="ri-close-large-line" id="popupCloseIcon"></i>
            </div>

            <p class="message" id="popupMessage">Your custom popup message box is now ready</p>

            <div class="btns">

                <div class="cancel-btn" id="popupCancelBtn">Cancel</div>

                <div class="confirm-btn" id="popupConfirmBtn">Confirm</div>

            </div>
        </div>
    </div>

    <!-- =============== NAVBAR =============== -->
    <nav class="navbar" id="navBar">

        <div class="nav-left" id="navLeft">
            <img src="../../../../assets/img/logo.avif" alt="Aqua Portal" loading="lazy">
            <p id="navWebName"></p>
        </div>

        <div class="nav-right">

            <div class="cta-btn" id="navPrimaryCtaBtn">
                <i class="ri-dashboard-line"></i>
                <span>Business</span>
            </div>

        </div>

    </nav>

    <!-- =============== DASHBOARD =============== -->
    <div class="dashboard">

        <div class="page-wrapper" id="pageWrapper">

            <!-- TOP BAR -->

            <div class="top-bar">

                <div class="search-box">

                    <i class="ri-search-line"></i>

                    <input type="text" placeholder="Search Voucher..." id="searchInput" oninput="searchVoucher()">

                </div>

            </div>

            <!-- ALL CARDS -->

            <div class="voucher-container" id="voucherContainer"></div>

            <!-- ================= EDIT MODAL ================= -->

            <div class="modal" id="editModal">

                <div class="modal-overlay" onclick="closeEditModal()"></div>

                <div class="modal-box">

                    <!-- HEADER -->
                    <div class="modal-header">

                        <h2>Edit Voucher</h2>

                        <button class="close-btn" onclick="closeEditModal()">
                            <i class="ri-close-line"></i>
                        </button>

                    </div>

                    <!-- BODY -->
                    <div class="modal-body">

                        <div class="form-grid">

                            <input type="hidden" id="editIndex">

                            <div class="input-box">
                                <label>Customer Name</label>
                                <input type="text" id="editCustomerName">
                            </div>

                            <div class="input-box">
                                <label>Email</label>
                                <input type="email" id="editEmail">
                            </div>

                            <div class="input-box">
                                <label>Mobile</label>
                                <input type="text" id="editMobile">
                            </div>

                            <div class="input-box">
                                <label>Voucher Date</label>
                                <input type="date" id="editDate">
                            </div>

                            <div class="input-box full">
                                <label>Address</label>
                                <textarea id="editAddress" rows="3"></textarea>
                            </div>

                            <div class="input-box">
                                <label>Total Amount</label>
                                <input type="text" id="editTotalAmount" inputmode="numeric">
                            </div>

                            <div class="input-box">
                                <label>Total Due</label>
                                <input type="text" id="editTotalDue" inputmode="numeric">
                            </div>

                        </div>

                    </div>

                    <!-- FOOTER -->
                    <div class="modal-footer">

                        <button class="save-btn" onclick="saveEditVoucher()">
                            <i class="ri-save-line"></i>
                            Save Changes
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- =============== FOOTER & CREDIT SECTION =============== -->
    <footer class="dashboard-footer">
        <p id="copyright">© 2026 MyDashboard. All Rights Reserved.</p>
        <p>Developed by <span id="devCredit">Shaikh Sarfraj</span></p>
    </footer>

</body>

</html>
