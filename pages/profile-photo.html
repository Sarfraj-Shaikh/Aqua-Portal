<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- =============== WEBSITE META DATA =============== -->
    <title>Profile Photo | Aqua Portal</title>
    <link rel="shortcut icon" href="../assets/img/logo.avif" type="image/x-icon">

    <!-- =============== AUTHOR META DATA =============== -->
    <meta name="author" content="Sarfraj Shaikh">
    <meta name="publisher" content="Sarfraj Shaikh">
    <meta name="creator" content="Sarfraj Shaikh">

    <!-- =============== CSS FILE =============== -->
    <link rel="stylesheet" href="../assets/files/css/pages/profile-photo.css">

    <!-- =============== JS FILE =============== -->
    <script src="../assets/files/js/pages/profile_photo.js" defer></script>

    <!-- =============== ICON CDN =============== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- =============== AOS & ANIMATE CDN =============== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

    <!-- =============== LOADER =============== -->
    <div class="page-loader" id="pageLoader">
        <div class="dot-spinner">
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
        </div>
    </div>

    <!-- =============== NO NETWORK =============== -->
    <div class="no-internet" id="noInternet">
        <div class="no-internet-card">

            <div class="icon-circle">
                <i class="ri-wifi-off-line"></i>
            </div>

            <h2>No Internet</h2>
            <p>
                You're offline. Please check your Wi-Fi or mobile data connection.
            </p>

            <div class="btn-group">
                <button class="retry-btn" onclick="location.reload()">
                    <i class="ri-refresh-line"></i> Retry
                </button>
            </div>

            <span class="hint">
                Waiting for network...
            </span>

        </div>
    </div>

    <!-- =============== NAVBAR =============== -->
    <nav class="navbar" id="navBar">

        <div class="nav-left" id="navLeft">
            <img src="../assets/img/logo.avif" alt="Aqua Portal" loading="lazy">
            <p id="navWebName"></p>
        </div>

        <div class="nav-right">

            <div class="cta-btn" id="navPrimaryCtaBtn">
                <i class="ri-home-line"></i>
                <span>Home</span>
            </div>

        </div>

    </nav>

    <!-- =============== UPLOAD PHOTO SECTION =============== -->
    <div class="main-container">

        <div class="upload-con">

            <div class="headBox">
                <h2>Upload Your Profile Photo</h2>
                <h3>Upload a profile picture (Max 1MB)</h3>
            </div>

            <img src="../assets/img/default-dp.jpg" alt="Profile Photo" loading="lazy" id="userPic">

            <div class="btnBox">

                <label for="fileInput" id="fileLabel">

                   <i class="ri-attachment-line"></i>
                    Choose Profile Photo

                    <input type="file" id="fileInput" hidden accept="image/*">

                </label>

                <div class="btn" id="nextBtn">
                    Next
                </div>

            </div>

        </div>
    </div>


</body>

</html>
