<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- =============== WEBSITE META DATA =============== -->
    <title>Login | Aqua Portal</title>
    <link rel="shortcut icon" href="../assets/img/logo.avif" type="image/x-icon">

    <!-- =============== AUTHOR META DATA =============== -->
    <meta name="author" content="Sarfraj Shaikh">
    <meta name="publisher" content="Sarfraj Shaikh">
    <meta name="creator" content="Sarfraj Shaikh">

    <!-- =============== CSS FILE =============== -->
    <link rel="stylesheet" href="../assets/files/css/pages/login.css">

    <!-- =============== JS FILE =============== -->
    <script src="../assets/files/js/pages/login.js" defer></script>

    <!-- =============== ICON CDN =============== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- =============== AOS & ANIMATE CDN =============== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>

    <!-- =============== LOADER =============== -->
    <div class="page-loader" id="pageLoader">
        <div class="dot-spinner">
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
        </div>
    </div>

    <!-- =============== NO NETWORK =============== -->
    <div class="no-internet" id="noInternet">
        <div class="no-internet-card">

            <div class="icon-circle">
                <i class="ri-wifi-off-line"></i>
            </div>

            <h2>No Internet</h2>
            <p>
                You're offline. Please check your Wi-Fi or mobile data connection.
            </p>

            <div class="btn-group">
                <button class="retry-btn" onclick="location.reload()">
                    <i class="ri-refresh-line"></i> Retry
                </button>
            </div>

            <span class="hint">
                Waiting for network...
            </span>

        </div>
    </div>

    <!-- =============== NAVBAR =============== -->
    <nav class="navbar" id="navBar">

        <div class="nav-left" id="navLeft">
            <img src="../assets/img/logo.avif" alt="Aqua Portal" loading="lazy">
            <p id="navWebName"></p>
        </div>

        <div class="nav-right">

            <div class="cta-btn" id="navPrimaryCtaBtn">
                <i class="ri-home-line"></i>
                <span>Home</span>
            </div>

        </div>

    </nav>

    <!-- =============== LOGIN SECTION =============== -->
    <div class="login-section">

        <div class="login-img">
        </div>

        <form class="loginForm" autocomplete="off">

            <div class="loginMessage">
                <h3>Welcome Back! 👋🏻</h3>
                <p>Please sign into account and start manage your businesses</p>
            </div>

            <div class="input-container">

                <p class="title">Email ID</p>

                <div class="input-box" id="emailIBox">

                    <i class="ri-mail-line"></i>
                    <input type="email" inputmode="email" id="emailInput" placeholder="Enter Your Email ID" autocomplete="off">

                </div>

                <p class="errorText" id="errorText1">Error Message</p>

            </div>

            <div class="input-container">

                <p class="title">Password</p>

                <div class="input-box" id="passIBox">

                    <i class="ri-lock-line"></i>
                    <input type="password" id="passwordInput" placeholder="Enter Your Password" autocomplete="off">
                    <i class="ri-eye-line passIcon" id="passToggleIcon" onclick="passToggle()"></i>

                </div>

                <p class="errorText" id="errorText2">Error Message</p>

            </div>

            <div class="remBox">
                <div class="checkbox-wrapper-4">
                    <input class="inp-cbx" id="morning" type="checkbox" checked/>
                    <label class="cbx" for="morning">
                        <span>
                            <svg width="12px" height="10px">
                                <use xlink:href="#check-4"></use>
                            </svg>
                        </span>
                        <span>Remember Me</span>
                    </label>
                    <svg class="inline-svg">
                        <symbol id="check-4" viewbox="0 0 12 10">
                            <polyline points="1.5 6 4.5 9 10.5 1"></polyline>
                        </symbol>
                    </svg>
                </div>
            </div>

            <div class="loginBtn" onclick="formVal()">
                Login Now
            </div>

            <div class="newuser">
                New on our platform? <span id="createNewAc">Create an account</span>
            </div>
        </form>
    </div>

</body>

</html>
